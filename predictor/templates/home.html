<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioCare | AI Heart Risk Assessment</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #c0392b;
            --light: #ecf0f1;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--light);
            padding-bottom: 1rem;
        }

        h1 { color: var(--primary); margin: 0; font-size: 1.8rem; }
        p.subtitle { color: #7f8c8d; margin-top: 5px; }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 0.9rem;
        }

        input, select {
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .full-width { grid-column: span 2; }

        button {
            grid-column: span 2;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover { background: #2980b9; }

        .result-box {
            grid-column: span 2;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            animation: fadeIn 0.5s ease-in;
        }

        .safe { background-color: #d4edda; color: var(--success); border: 1px solid #c3e6cb; }
        .danger { background-color: #f8d7da; color: var(--danger); border: 1px solid #f5c6cb; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            button, .result-box { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🫀 CardioCare AI</h1>
            <p class="subtitle">Clinical Decision Support System for Heart Disease Risk</p>
        </header>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Age (Years)</label>
                <input type="number" name="age" placeholder="e.g. 45" required>
            </div>

            <div class="form-group">
                <label>Sex</label>
                <select name="sex">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Chest Pain Type</label>
                <select name="cp">
                    <option value="0">Typical Angina (Heart Related)</option>
                    <option value="1">Atypical Angina</option>
                    <option value="2">Non-anginal Pain</option>
                    <option value="3">Asymptomatic</option>
                </select>
            </div>

            <div class="form-group">
                <label>Resting Blood Pressure (mm Hg)</label>
                <input type="number" name="trestbps" placeholder="e.g. 120" required>
            </div>

            <div class="form-group">
                <label>Serum Cholesterol (mg/dl)</label>
                <input type="number" name="chol" placeholder="e.g. 200" required>
            </div>

            <div class="form-group">
                <label>Fasting Blood Sugar > 120 mg/dl?</label>
                <select name="fbs">
                    <option value="0">False</option>
                    <option value="1">True</option>
                </select>
            </div>

            <div class="form-group">
                <label>Resting ECG Results</label>
                <select name="restecg">
                    <option value="0">Normal</option>
                    <option value="1">ST-T Wave Abnormality</option>
                    <option value="2">Left Ventricular Hypertrophy</option>
                </select>
            </div>

            <div class="form-group">
                <label>Max Heart Rate Achieved</label>
                <input type="number" name="thalach" placeholder="e.g. 150" required>
            </div>

            <div class="form-group">
                <label>Exercise Induced Angina?</label>
                <select name="exang">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Oldpeak (ST Depression)</label>
                <input type="number" step="0.1" name="oldpeak" placeholder="e.g. 1.0" required>
            </div>

            <div class="form-group">
                <label>Slope of Peak Exercise ST</label>
                <select name="slope">
                    <option value="0">Upsloping (Better)</option>
                    <option value="1">Flat (Warning)</option>
                    <option value="2">Downsloping (Bad)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Major Vessels Colored by Fluoroscopy</label>
                <input type="number" name="ca" min="0" max="3" placeholder="0-3" required>
            </div>

            <div class="form-group full-width">
                <label>Thalassemia</label>
                <select name="thal">
                    <option value="1">Normal</option>
                    <option value="2">Fixed Defect</option>
                    <option value="3">Reversable Defect</option>
                </select>
            </div>
            
            <button type="submit">Analyze Patient Data</button>

            {% if result %}
                <div class="result-box {% if 'Healthy' in result %}safe{% else %}danger{% endif %}">
                    {{ result }}
                </div>
            {% endif %}
        </form>
    </div>

</body>
</html>
